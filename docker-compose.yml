name: nexora

x-backend-environment: &backend-environment
  NEXORA_ENVIRONMENT: ${NEXORA_ENVIRONMENT:-development}
  NEXORA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-nexora}
  NEXORA_JWT_SECRET: ${NEXORA_JWT_SECRET:?define NEXORA_JWT_SECRET en .env}
  NEXORA_JWT_ALGORITHM: ${NEXORA_JWT_ALGORITHM:-HS256}
  NEXORA_JWT_ISSUER: ${NEXORA_JWT_ISSUER:-nexora}
  NEXORA_JWT_AUDIENCE: ${NEXORA_JWT_AUDIENCE:-nexora-app}
  NEXORA_ACCESS_TOKEN_TTL_MINUTES: ${NEXORA_ACCESS_TOKEN_TTL_MINUTES:-10}
  NEXORA_REFRESH_TOKEN_TTL_DAYS: ${NEXORA_REFRESH_TOKEN_TTL_DAYS:-7}
  NEXORA_SESSION_IDLE_TIMEOUT_MINUTES: ${NEXORA_SESSION_IDLE_TIMEOUT_MINUTES:-30}
  NEXORA_SESSION_ABSOLUTE_TIMEOUT_HOURS: ${NEXORA_SESSION_ABSOLUTE_TIMEOUT_HOURS:-12}
  NEXORA_REFRESH_ROTATION_GRACE_SECONDS: ${NEXORA_REFRESH_ROTATION_GRACE_SECONDS:-30}
  NEXORA_SESSION_ACTIVITY_TOUCH_SECONDS: ${NEXORA_SESSION_ACTIVITY_TOUCH_SECONDS:-60}
  NEXORA_SESSION_WARNING_SECONDS: ${NEXORA_SESSION_WARNING_SECONDS:-120}
  NEXORA_COOKIE_SAMESITE: ${NEXORA_COOKIE_SAMESITE:-lax}
  NEXORA_COOKIE_DOMAIN: ${NEXORA_COOKIE_DOMAIN:-}
  NEXORA_ALLOWED_ORIGINS: '${NEXORA_ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:45334","http://127.0.0.1:5173","http://127.0.0.1:45334"]}'
  NEXORA_BOOTSTRAP_ADMIN_USERNAME: ${NEXORA_BOOTSTRAP_ADMIN_USERNAME:-}
  NEXORA_BOOTSTRAP_ADMIN_EMAIL: ${NEXORA_BOOTSTRAP_ADMIN_EMAIL:-}
  NEXORA_BOOTSTRAP_ADMIN_PASSWORD: ${NEXORA_BOOTSTRAP_ADMIN_PASSWORD:-}
  NEXORA_BOOTSTRAP_ADMIN_FIRST_NAME: ${NEXORA_BOOTSTRAP_ADMIN_FIRST_NAME:-Administrador}
  NEXORA_BOOTSTRAP_ADMIN_LAST_NAME: ${NEXORA_BOOTSTRAP_ADMIN_LAST_NAME:-NEXORA}
  NEXORA_LOGIN_MAX_ATTEMPTS: ${NEXORA_LOGIN_MAX_ATTEMPTS:-5}
  NEXORA_LOGIN_ATTEMPT_WINDOW_SECONDS: ${NEXORA_LOGIN_ATTEMPT_WINDOW_SECONDS:-300}
  NEXORA_LOGIN_BLOCK_SECONDS: ${NEXORA_LOGIN_BLOCK_SECONDS:-900}

x-backend-build: &backend-build
  build:
    context: ./backend
  image: nexora-backend:${NEXORA_IMAGE_TAG:-local}

services:
  postgres:
    image: postgres:17-alpine
    container_name: nexora-postgres
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    ports:
      # En produccion conviene no publicar la base: POSTGRES_HOST_PORT=127.0.0.1:45336 o quitarlo.
      - "${POSTGRES_HOST_PORT:-45336}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nexora]

  # Base efimera para las pruebas de integracion: docker compose --profile test up -d postgres-test
  postgres-test:
    image: postgres:17-alpine
    container_name: nexora-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-nexora_test}
    ports:
      - "${POSTGRES_TEST_HOST_PORT:-45337}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_TEST_DB:-nexora_test}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nexora]

  # Proceso controlado de migraciones: espera a que PostgreSQL este sano y termina.
  # La API no arranca hasta que este servicio sale con exito.
  migrate:
    <<: *backend-build
    container_name: nexora-migrate
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [nexora]

  api:
    <<: *backend-build
    container_name: nexora-api
    command:
      - uvicorn
      - nexora.bootstrap.app:create_app
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "${API_WORKERS:-1}"
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_HOST_PORT:-45335}:8000"
    restart: ${RESTART_POLICY:-unless-stopped}
    networks: [nexora]

  # Frontend de produccion: archivos estaticos en Nginx sin privilegios; /api va a la API (mismo origen).
  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-NEXORA}
    image: nexora-frontend:${NEXORA_IMAGE_TAG:-local}
    container_name: nexora-frontend
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-45334}:8080"
    restart: ${RESTART_POLICY:-unless-stopped}
    networks: [nexora]

  # Frontend de desarrollo con recarga en caliente: docker compose --profile dev up -d frontend-dev
  frontend-dev:
    build:
      context: ./frontend
      target: dev
    image: nexora-frontend-dev:${NEXORA_IMAGE_TAG:-local}
    container_name: nexora-frontend-dev
    profiles: ["dev"]
    environment:
      VITE_DEV_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_DEV_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    networks: [nexora]

networks:
  nexora:
    driver: bridge

volumes:
  postgres-data:
    name: nexora-postgres-data
