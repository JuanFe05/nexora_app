[project]
name = "nexora-backend"
version = "0.1.0"
description = "Backend de la plataforma NEXORA"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "fastapi>=0.121",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "python-dotenv>=1.2",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nexora"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
packages = ["nexora"]
mypy_path = "src"
strict = true
warn_unused_ignores = false
